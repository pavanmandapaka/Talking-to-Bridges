<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking to Bridges - Voice Mode</title>
    <style>
        body {
            background-color: #0e1117;
            color: #fafafa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        p { color: #888; margin-bottom: 40px; }
        
        .orb-container {
            width: 200px;
            height: 200px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }
        
        .orb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88 0%, #00b4d8 100%);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        
        .orb.listening {
            animation: pulse 1.5s infinite alternate;
            background: linear-gradient(135deg, #ff0055 0%, #ffaa00 100%);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.6);
        }
        
        .orb.thinking {
            animation: spin 1s infinite linear;
            background: conic-gradient(from 0deg, transparent 0%, #0088ff 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0, 136, 255, 0.5);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 0, 85, 0.4); }
            100% { transform: scale(1.2); box-shadow: 0 0 60px rgba(255, 0, 85, 0.8); }
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .upload-container {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
        }
        
        .upload-btn {
            background: #1a1c23;
            color: #ccc;
            border: 1px solid #333;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .upload-btn:hover {
            background: #333;
            color: #fff;
        }
        
        #upload-status {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
        
        #status { font-size: 1.2rem; margin-bottom: 20px; height: 30px; font-weight: bold; }
        #chat-log {
            width: 80%;
            max-width: 600px;
            height: 200px;
            overflow-y: auto;
            background: #1a1c23;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            font-size: 14px;
            border: 1px solid #333;
        }
        .user-msg { color: #00ff88; margin-bottom: 10px; }
        .ai-msg { color: #00b4d8; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="upload-container">
        <input type="file" id="file-upload" accept=".pdf,.txt,.docx" style="display:none;" onchange="uploadDocument()">
        <button onclick="document.getElementById('file-upload').click()" class="upload-btn">📄 Upload Context Document</button>
        <div id="upload-status"></div>
    </div>

    <h1>VOICE AGENT</h1>
    <p>TALKING TO BRIDGES</p>

    <div class="orb-container">
        <div id="orb" class="orb" onclick="startSystem()"></div>
    </div>

    <div id="status">Click the orb to start</div>
    
    <div id="chat-log"></div>

    <script>
        const orb = document.getElementById('orb');
        const statusEl = document.getElementById('status');
        const chatLog = document.getElementById('chat-log');
        
        let mediaRecorder;
        let audioChunks = [];
        let isSystemActive = false;
        let isSpeaking = false;
        let silenceTimer;
        let isRecording = false;
        let currentAudio = null;
        let localStream = null;

        async function uploadDocument() {
            const fileInput = document.getElementById('file-upload');
            const statusDiv = document.getElementById('upload-status');
            const file = fileInput.files[0];
            if (!file) return;

            statusDiv.innerText = "Uploading to vector database...";
            const formData = new FormData();
            formData.append("file", file);

            try {
                const res = await fetch("http://127.0.0.1:8000/upload", { method: "POST", body: formData });
                if (res.ok) {
                    statusDiv.innerText = "Document processed & ready!";
                    statusDiv.style.color = "#00ff88";
                } else {
                    const data = await res.json();
                    statusDiv.innerText = "Error: " + (data.detail || "Upload failed");
                    statusDiv.style.color = "#ff0055";
                }
            } catch (err) {
                statusDiv.innerText = "Failed to connect to backend.";
                statusDiv.style.color = "#ff0055";
            }
        }
        
        function stopSystem(message) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            chatLog.innerHTML += `<div class="ai-msg" style="color: #ffaa00"><b>SYSTEM:</b> ${message}</div>`;
            chatLog.scrollTop = chatLog.scrollHeight;
            statusEl.innerText = "System Stopped. Click orb to restart.";
            orb.className = "orb";
            orb.style.background = ""; // Reset to CSS default or hardcode if needed
            orb.style.boxShadow = "none";
            isSystemActive = false;
            isSpeaking = false;
            isRecording = false;
        }

        async function startSystem() {
            // TOGGLE LOGIC: If system is running, clicking orb stops it entirely.
            if (isSystemActive) {
                stopSystem("Agent Paused by User.");
                return;
            }

            isSystemActive = true;
            statusEl.innerText = "Connecting to microphone...";
            orb.style.background = ""; // Reset from stop state
            orb.style.boxShadow = "";
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // Set up MediaRecorder
                mediaRecorder = new MediaRecorder(localStream);
                mediaRecorder.ondataavailable = e => { audioChunks.push(e.data); };
                mediaRecorder.onstop = processAudio;
                
                // Set up Silence Detection (VAD)
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(localStream);
                const javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
                
                analyser.smoothingTimeConstant = 0.8;
                analyser.fftSize = 1024;
                
                microphone.connect(analyser);
                analyser.connect(javascriptNode);
                javascriptNode.connect(audioContext.destination);
                
                statusEl.innerText = "Listening... (Auto-stops on silence)";
                orb.className = "orb listening";
                
                javascriptNode.onaudioprocess = function() {
                    if (isSpeaking) return; 
                    if (!isSystemActive) return; 
                    
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let values = 0;
                    for (let i = 0; i < array.length; i++) { values += (array[i]); }
                    const average = values / array.length;
                    
                    // Volume threshold for speech
                    if (average > 15) {
                        clearTimeout(silenceTimer);
                        if (!isRecording) {
                            audioChunks = [];
                            mediaRecorder.start();
                            isRecording = true;
                            orb.style.transform = "scale(1.2)";
                        }
                        
                        // Stop recording after 1.5 seconds of silence
                        silenceTimer = setTimeout(() => {
                            if (isRecording) {
                                mediaRecorder.stop();
                                isRecording = false;
                                orb.style.transform = "scale(1)";
                                statusEl.innerText = "Processing...";
                                orb.className = "orb thinking";
                            }
                        }, 1500);
                    }
                }
            } catch (err) {
                statusEl.innerText = "Microphone access denied.";
                isSystemActive = false;
            }
        }

        async function processAudio() {
            if (!isSystemActive) return;
            isSpeaking = true; // Pause listening
            
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append("audio", audioBlob, "mic.wav");
            
            try {
                // 1. Transcribe (Faster-Whisper GPU)
                const sttRes = await fetch("http://127.0.0.1:8000/transcribe", { method: "POST", body: formData });
                const sttData = await sttRes.json();
                const text = sttData.text.trim();
                
                if (!text) { resetListening(); return; }
                
                chatLog.innerHTML += `<div class="user-msg"><b>YOU:</b> ${text}</div>`;
                chatLog.scrollTop = chatLog.scrollHeight;
                
                // SHUTDOWN COMMAND LOGIC
                const cleanText = text.toLowerCase().replace(/[^a-z ]/g, "").trim();
                if (cleanText === "stop" || cleanText === "goodbye" || cleanText === "quit" || cleanText === "exit") {
                    stopSystem("Voice Agent Stopped via Voice Command.");
                    return;
                }
                
                // 2. LLM Chat
                statusEl.innerText = "Thinking...";
                const chatRes = await fetch("http://127.0.0.1:8000/api/chat", {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: text})
                });
                const chatData = await chatRes.json();
                const answer = chatData.answer;
                
                if (!isSystemActive) return; // Abort if user stopped during processing
                
                chatLog.innerHTML += `<div class="ai-msg"><b>AI:</b> ${answer}</div>`;
                chatLog.scrollTop = chatLog.scrollHeight;
                
                // 3. TTS Speak
                statusEl.innerText = "Speaking... (Click orb to pause system)";
                const ttsRes = await fetch("http://127.0.0.1:8000/speak", {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: answer})
                });
                const ttsData = await ttsRes.json();
                
                if (!isSystemActive) return;
                
                // Play Audio
                currentAudio = new Audio("data:" + ttsData.content_type + ";base64," + ttsData.audio_base64);
                currentAudio.play();
                
                currentAudio.onended = () => { 
                    currentAudio = null;
                    if (isSystemActive) resetListening(); 
                };
                
            } catch (err) {
                console.error(err);
                chatLog.innerHTML += `<div class="user-msg" style="color:red">Error communicating with backend.</div>`;
                if (isSystemActive) resetListening();
            }
        }
        
        function resetListening() {
            if (!isSystemActive) return;
            isSpeaking = false;
            statusEl.innerText = "Listening... (Auto-stops on silence)";
            orb.className = "orb listening";
        }
    </script>
</body>
</html>
